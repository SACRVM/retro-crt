name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Retro.Crt.slnx

      - name: Build
        run: dotnet build Retro.Crt.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Retro.Crt.slnx --configuration Release --no-build --logger "trx" --results-directory TestResults --collect:"XPlat Code Coverage"

      - name: Pack (sanity check NuGet metadata)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Retro.Crt/Retro.Crt.csproj --configuration Release --no-build --output nupkg

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

      - name: Upload nupkg (sanity)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: retro-crt-nupkg
          path: nupkg/*.*nupkg
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  trim-smoke:
    name: trim publish (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish demo trimmed
        run: |
          dotnet publish samples/Retro.Crt.Demo/Retro.Crt.Demo.csproj \
            --configuration Release \
            -p:PublishTrimmed=true \
            -p:TrimMode=full \
            -p:IsAotCompatible=true \
            --nologo \
            /warnaserror

  aot-smoke:
    name: AOT publish (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish demo AOT
        run: |
          dotnet publish samples/Retro.Crt.Demo/Retro.Crt.Demo.csproj \
            --configuration Release \
            -p:PublishAot=true \
            --nologo \
            /warnaserror

      - name: Show binary size
        run: |
          find samples/Retro.Crt.Demo/bin/Release -type f -name 'Retro.Crt.Demo*' -exec ls -lh {} \;
